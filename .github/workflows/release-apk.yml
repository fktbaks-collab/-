name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: نصب وابستگی‌ها
        run: npm install

      - name: ساخت نسخه وب
        run: npm run build

      - name: نصب Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: تنظیم Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تنظیم Android SDK
        uses: android-actions/setup-android@v3

      - name: تنظیم خودکار نسخه اندروید
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          run_number = int(os.environ["RUN_NUMBER"])

          # شماره نسخه اندروید همیشه از نسخه قبلی بزرگ‌تر خواهد بود.
          # مثال:
          # اجرای 6  -> versionCode 1006
          # اجرای 7  -> versionCode 1007
          # اجرای 8  -> versionCode 1008
          version_code = 1000 + run_number
          version_name = f"1.0.{run_number}"

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              f'versionName "{version_name}"',
              text,
              count=1
          )

          gradle_file.write_text(text)

          print(f"versionCode = {version_code}")
          print(f"versionName = {version_name}")
          PY

      - name: دریافت Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > quiz-master-release-key.jks
          chmod 600 quiz-master-release-key.jks

      - name: بررسی Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore quiz-master-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias quiz-master

      - name: ساخت APK امضاشده
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/quiz-master-release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="quiz-master" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: آپلود Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-master-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
