name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: نصب وابستگی‌ها
        run: npm install

      - name: ساخت نسخه وب
        run: npm run build

      - name: نصب Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: تنظیم Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تنظیم Android SDK
        uses: android-actions/setup-android@v3

      - name: دریافت Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > quiz-master-release-key.jks
          chmod 600 quiz-master-release-key.jks

      - name: ساخت APK امضاشده
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/quiz-master-release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="quiz-master" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: آپلود Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-master-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
